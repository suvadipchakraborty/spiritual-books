name = "spiritual-library"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# Static frontend (HTML/CSS/JS/manifest/icons) lives in ./public and is
# served directly by the Worker through the ASSETS binding below.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[observability]
enabled = true
